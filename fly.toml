app = "inboxiq-mcp"
primary_region = "sjc"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/inboxiq-mcp.db"
  ISSUER_URL = "https://mcp.kreativekoala.llc"

[[mounts]]
  source = "inboxiq_mcp_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
